# Scenario A -- early voice-agent development.
#
# One world, four contexts.  The 2-minute / 40-minute / 5-hour hierarchy must emerge
# from (cases x replications x 120s), not from anything written down here.  Nothing in
# this file names a replication count, a cadence or a scope.

scenario: voice_early

failure_mode:
  id: VFD-TURNTAKING
  version: v4
  case_id: CASE-checklist-step-3-barge-in
  description: >-
    Agent mishandles a barge-in during checklist step 3 and drops the caller's
    correction.

# The build being planned against, and the behaviour distribution its owner declares
# it to be in.  Qualification rows name the distribution they were measured against;
# changing this id to something no row names orphans all of them at once.
system_under_test:
  system_version: voice-agent-2026.09.18
  distribution_id: voice-agent-turntaking-r4

known_regression_cases:
  - CASE-checklist-step-3-barge-in
  - CASE-happy-path-intake
  - CASE-number-readback
  - CASE-transfer-to-human
  - CASE-voicemail-detect
  - CASE-noisy-line
  - CASE-caller-hangup-mid-turn
  - CASE-dtmf-fallback
  - CASE-spelling-clarification
  - CASE-address-capture
  - CASE-insurance-lookup
  - CASE-appointment-offer
  - CASE-reschedule
  - CASE-cancel
  - CASE-language-switch
  - CASE-long-pause
  - CASE-overlapping-speech
  - CASE-callback-request
  - CASE-consent-capture
  - CASE-closing-summary

populations:
  # The single scenario the current change touches.
  - id: affected_scenario
    denominator: affected regression scenarios
    kind: enumerable_corpus
    case_ids:
      - CASE-checklist-step-3-barge-in

  # All 20 scenarios.  20 x 120s = 40 minutes for one replication.
  - id: scenario_corpus
    denominator: regression scenarios
    kind: enumerable_corpus
    case_ids:
      - CASE-checklist-step-3-barge-in
      - CASE-happy-path-intake
      - CASE-number-readback
      - CASE-transfer-to-human
      - CASE-voicemail-detect
      - CASE-noisy-line
      - CASE-caller-hangup-mid-turn
      - CASE-dtmf-fallback
      - CASE-spelling-clarification
      - CASE-address-capture
      - CASE-insurance-lookup
      - CASE-appointment-offer
      - CASE-reschedule
      - CASE-cancel
      - CASE-language-switch
      - CASE-long-pause
      - CASE-overlapping-speech
      - CASE-callback-request
      - CASE-consent-capture
      - CASE-closing-summary

sources:
  # A scripted simulation that asserts a fixed criterion.  Cannot find what it was
  # not told to look for, which is what makes it useless for discovery.
  - id: behavioral_simulation
    version: v3
    kind: deterministic
    open_ended: false

  # General-rubric judge over the transcript.  Noisy, but can surface a defect the
  # team has not characterised yet.
  - id: transcript_judge
    version: v7
    kind: stochastic_judge
    open_ended: true

economics:
  - source: behavioral_simulation@v3
    cost_per_invocation_usd: 0.0
    latency_seconds_per_invocation: 120.0

  # 20 scenarios x 7 replications x $0.0625 = $8.75.  The per-invocation price is the
  # input; the $8.75 is an output, quoted here only so a reader can check the
  # arithmetic.  It is not a budget the planner is trying to hit.
  - source: transcript_judge@v7
    cost_per_invocation_usd: 0.0625
    latency_seconds_per_invocation: 120.0

qualification:
  # Deterministic assertion: no measured error in either direction, and the RED/GREEN
  # pair from the last verification cycle.
  - source: behavioral_simulation@v3
    failure_mode: VFD-TURNTAKING@v4
    population: affected_scenario
    measured_against: voice-agent-turntaking-r4
    positive_cases: 30
    true_positives: 30
    negative_cases: 30
    false_positives: 0
    prove_red_runs: 1
    prove_green_runs: 1
    evidence_date: 2026-09-18

  # Deliberately NO row for behavioral_simulation@v3 x scenario_corpus.  Someone wrote
  # a targeted assertion for the scenario they were debugging; nobody has a
  # machine-verifiable oracle for turn-taking quality across the whole corpus.  That
  # absence -- not a rule about judges -- is why the broad runs must use the judge.

  # Judge, measured end-to-end over (nondeterministic agent x nondeterministic judge).
  # This pair is what forces multiple replications.
  - source: transcript_judge@v7
    failure_mode: VFD-TURNTAKING@v4
    population: affected_scenario
    measured_against: voice-agent-turntaking-r4
    positive_cases: 120
    true_positives: 84
    negative_cases: 120
    false_positives: 12
    prove_red_runs: 3
    prove_green_runs: 3
    evidence_date: 2026-09-12
    known_limitations:
      - sensitivity measured on a single accent cohort
      - >-
        pooled over cases with no per-case record retained, so nothing here can
        distinguish a judge that fluctuates around the right label from one that is
        reliably wrong on a subset. See docs/measurement_review.md; characterize-evaluator
        is the tool that would settle it.

  - source: transcript_judge@v7
    failure_mode: VFD-TURNTAKING@v4
    population: scenario_corpus
    measured_against: voice-agent-turntaking-r4
    positive_cases: 120
    true_positives: 84
    negative_cases: 120
    false_positives: 12
    prove_red_runs: 3
    prove_green_runs: 3
    evidence_date: 2026-09-12

assurance_profiles:
  # PROVENANCE, stated because hiding it would make this scenario evidence for a claim
  # it cannot support.  These two numbers were NOT elicited from anyone with authority
  # over the risk.  They were chosen, after the fact, because 0.35 and 0.05 are the
  # values that make a 0.70-sensitivity judge come out at n=1 and n=7 -- the shape the
  # scenario was written to illustrate.  The derivation n = f(sensitivity, fpr, error)
  # is sound; this file is a demonstration of it, not a measurement of anyone's risk
  # appetite.  A real profile_ref points at a decision someone signed.
  #
  # The separation the planner depends on:
  #
  #   Policy       maximum_error_requirement -- asserted here, never inferred
  #   Measurement  sensitivity and fpr       -- counts below, with their sample size
  #   Planner      the cheapest admissible plan given exactly those two
  #
  # Treat a change to either number as a change of scenario, not a tuning knob.
  screen:
    profile_ref: VOICE-SCREEN-2026Q3
    maximum_error_requirement: 0.35

  # Same mechanisms, same economics, seven-times-tighter error requirement.  The
  # replication count the planner derives is the only thing that moves.
  gate:
    profile_ref: VOICE-GATE-2026Q3
    maximum_error_requirement: 0.05

contexts:
  - name: inner_loop
    intent: verify_fix
    feedback_budget_seconds: 300
    changes_per_window: 20
    checkpoints_per_window: 3
    assurance_profile: gate

  - name: checkpoint
    intent: assess_blast_radius
    feedback_budget_seconds: 3600
    changes_per_window: 20
    checkpoints_per_window: 3
    assurance_profile: screen

  - name: nightly
    intent: release
    feedback_budget_seconds: 28800
    changes_per_window: 20
    checkpoints_per_window: 3
    assurance_profile: gate

  # The behavioural surface is still evolving and the team wants to know what else is
  # broken.  The free deterministic assertion cannot answer this at any price.
  - name: discovery
    intent: discover
    feedback_budget_seconds: 300
    changes_per_window: 20
    checkpoints_per_window: 3
    assurance_profile: screen
